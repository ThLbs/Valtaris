<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!--
  Sécurité : cette politique interdit TOUTE connexion réseau (fetch, XHR, WebSocket, images, polices,
  formulaires, iframes). Seul le script ci-dessous, identifié par son empreinte SHA-256, peut s'exécuter.
  Après toute modification du script, relancer : node outils/sceller.js
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-jM+cbNIARBNxBbI0lsero1bGfyWXR2PgeRJE07lqgT4='; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finances perso</title>
<style>
:root{
  --bg:#f5f6f8;--panel:#fff;--panel2:#eef0f3;--text:#1b1f24;--muted:#646c78;--border:#e1e4e9;
  --accent:#3b6cf6;--accent-soft:rgba(59,108,246,.16);--on-accent:#fff;
  --pos:#178a5c;--neg:#d0353b;--warn:#b7791f;--shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1216;--panel:#171b21;--panel2:#1f242c;--text:#e7eaee;--muted:#9aa3ae;--border:#2a3038;
  --accent:#7495ff;--accent-soft:rgba(116,149,255,.2);--on-accent:#0b0e12;
  --pos:#3ccf8e;--neg:#ff6b70;--warn:#f0b54a;--shadow:none;color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h2{font-size:20px;margin:0}
h3{font-size:15px;margin:0 0 12px}
.muted{color:var(--muted)} .small{font-size:12px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
.nowrap{white-space:nowrap}
[hidden]{display:none!important}

/* Verrou */
.lock{min-height:100vh;display:grid;place-items:center;padding:16px}
.lock-card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:28px;box-shadow:var(--shadow)}
.lock-card h1{font-size:22px;margin:0 0 4px}
.lock-card .sep{text-align:center;color:var(--muted);margin:14px 0;font-size:12px}
.err{color:var(--neg);min-height:1.2em;margin:0}

/* Structure */
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--border)}
.hbar{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 16px;flex-wrap:wrap}
.brand{font-weight:700;margin-right:12px}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--muted);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button:hover{background:var(--panel2);color:var(--text)}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.spacer{flex:1}
#status{font-size:12px;color:var(--muted)}
main{max-width:1240px;margin:0 auto;padding:16px}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px}
.grid2>.card{margin-bottom:0}
.grid2+.grid2,.grid2+.card,.kpis+.grid2{margin-top:16px}
.grid-side{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.grid-side{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi .l{font-size:12px;color:var(--muted)} .kpi .v{font-size:21px;font-weight:650;margin:2px 0;font-variant-numeric:tabular-nums} .kpi .s{font-size:12px;color:var(--muted)}
.banner{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.empty{color:var(--muted);text-align:center;padding:28px 8px;margin:0}

/* Formulaires */
input,select,textarea{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:7px 9px;min-width:0}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type=color]{padding:2px;width:42px;height:32px}
input[type=checkbox]{width:auto}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.inline{flex-direction:row;align-items:center;gap:8px;color:var(--text)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>label{flex:1 1 140px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:13px;padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;flex-direction:row}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--neg);border-color:var(--neg)}
.btn:disabled{opacity:.6;cursor:wait}
.icon{background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:6px;font-size:14px}
.icon:hover{background:var(--panel2);color:var(--text)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input[type=search]{flex:1 1 200px}
.sim-form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sim-form .full{grid-column:1/-1}
.presets{display:flex;gap:6px;flex-wrap:wrap}

/* Tableaux */
.table-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;white-space:nowrap}
.tbl .actions{white-space:nowrap;text-align:right}
.cat-sel{max-width:220px;padding:4px 6px}
.inline-num{width:110px;text-align:right;padding:4px 6px}
.summary{font-size:13px;color:var(--muted);margin-bottom:8px}
.budget-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.budget-grid label{flex-direction:row;align-items:center;justify-content:space-between;color:var(--text)}
.budget-grid input{width:100px;text-align:right}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;flex:none}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bar-track{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px}
details summary{cursor:pointer;color:var(--accent);margin-top:8px}

/* Graphiques */
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--border);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.donut-wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut-wrap svg{width:180px;flex:none}
.donut-legend{flex:1;min-width:200px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.donut-legend div{display:flex;align-items:center;gap:4px}
.donut-legend span.n{margin-left:auto;font-variant-numeric:tabular-nums}
.donut-legend span.p{width:52px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}

/* Mode discret */
body.discret .amt{filter:blur(7px);transition:filter .15s}
body.discret .amt:hover{filter:none}

/* Modale & toast */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px;z-index:20}
.modal-card{background:var(--panel);border-radius:14px;padding:20px;width:100%;max-width:640px;max-height:90vh;overflow:auto;border:1px solid var(--border)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal-head h3{margin:0}
#toasts{position:fixed;bottom:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:30;max-width:calc(100vw - 32px)}
.toast{background:var(--text);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.toast.err{background:var(--neg);color:#fff}
.toast button{background:none;border:1px solid currentColor;color:inherit;border-radius:6px;padding:3px 8px;cursor:pointer;font:inherit;font-size:12px}
ul.sec{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
</style>
</head>
<body>

<div id="lock" class="lock">
  <div class="lock-card">
    <h1>🔒 Finances perso</h1>
    <p class="muted" style="margin-top:0">Coffre chiffré, 100 % local. Aucune donnée ne quitte cet ordinateur.</p>
    <div id="lockBody"></div>
  </div>
</div>

<div id="app" hidden>
  <header><div class="hbar">
    <span class="brand">◆ Finances</span>
    <nav>
      <button data-act="tab" data-tab="dash">Tableau de bord</button>
      <button data-act="tab" data-tab="tx">Dépenses</button>
      <button data-act="tab" data-tab="inv">Investissements</button>
      <button data-act="tab" data-tab="proj">Projections</button>
      <button data-act="tab" data-tab="set">Paramètres</button>
    </nav>
    <span class="spacer"></span>
    <span id="status"></span>
    <button class="icon" data-act="discret" title="Mode discret : masque les montants">👁</button>
    <button class="btn" data-act="lock" title="Verrouiller maintenant">🔒 Verrouiller</button>
  </div></header>
  <main>
    <section id="tab-dash"></section>
    <section id="tab-tx" hidden></section>
    <section id="tab-inv" hidden></section>
    <section id="tab-proj" hidden></section>
    <section id="tab-set" hidden></section>
  </main>
</div>

<div id="modal" class="modal" hidden><div class="modal-card" id="modalBody"></div></div>
<div id="toasts"></div>

<script>
'use strict';
/* =====================================================================
   Finances perso — application locale chiffrée
   - Données chiffrées AES-256-GCM, clé dérivée du mot de passe (PBKDF2-SHA256)
   - Stockage : localStorage de ce navigateur (uniquement le texte chiffré)
   - Aucune requête réseau possible (CSP)
   ===================================================================== */

// ---------- Utilitaires ----------
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ESC[c]);
const pad = n => String(n).padStart(2, '0');
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const round2 = v => Math.round(v * 100) / 100;
const uid = () => [...crypto.getRandomValues(new Uint8Array(8))].map(b => b.toString(16).padStart(2, '0')).join('');
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const safeColor = c => /^#[0-9a-f]{6}$/i.test(c) ? c : '#8a8f98';
const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };
function today() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function fmtDate(iso) { const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; }

const EUR = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' });
const EUR0 = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const NUM = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 6 });
const MF = new Intl.DateTimeFormat('fr-FR', { month: 'long', year: 'numeric' });
const MS = new Intl.DateTimeFormat('fr-FR', { month: 'short' });
const fmtEur = (v, dec = true) => (dec ? EUR : EUR0).format(v);
const money = (v, dec = true) => `<span class="amt">${esc(fmtEur(v, dec))}</span>`;
const signMoney = (v, dec = true) => `<span class="amt ${v > 0 ? 'pos' : v < 0 ? 'neg' : ''}">${v > 0 ? '+' : ''}${esc(fmtEur(v, dec))}</span>`;
const pct = v => (v * 100).toFixed(1).replace('.', ',') + ' %';
function compact(v) {
  const a = Math.abs(v);
  if (a >= 1e6) return (v / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace('.', ',') + ' M€';
  if (a >= 1e3) return (v / 1e3).toFixed(a >= 1e4 ? 0 : 1).replace('.', ',') + ' k€';
  return Math.round(v) + ' €';
}
function monthLabel(k) { const [y, m] = k.split('-').map(Number); return MF.format(new Date(y, m - 1, 1)); }
function shortMonth(k) { const [y, m] = k.split('-').map(Number); return MS.format(new Date(y, m - 1, 1)).replace('.', ''); }
function addMonths(k, n) { const [y, m] = k.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; }
function lastMonths(n, end) { return Array.from({ length: n }, (_, i) => addMonths(end, i - n + 1)); }
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- Cryptographie ----------
const VAULT_KEY = 'financesPerso.vault.v1';
const ITER = 600000;
const AAD = new TextEncoder().encode('finances-perso:v1');
function b64enc(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
function b64dec(s) { const b = atob(s); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
async function deriveKey(pw, salt, iter) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base,
    { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function newSession(pw) { const salt = crypto.getRandomValues(new Uint8Array(16)); return { key: await deriveKey(pw, salt, ITER), salt, iter: ITER }; }
async function encryptObj(obj, sess) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: AAD }, sess.key, new TextEncoder().encode(JSON.stringify(obj)));
  return { app: 'finances-perso', v: 1, kdf: 'PBKDF2-SHA256', iter: sess.iter, salt: b64enc(sess.salt), iv: b64enc(iv), ct: b64enc(new Uint8Array(ct)) };
}
function isVault(o) { return o && o.app === 'finances-perso' && o.v === 1 && typeof o.salt === 'string' && typeof o.iv === 'string' && typeof o.ct === 'string' && Number.isInteger(o.iter) && o.iter >= 100000; }
async function decryptVault(vault, pw) {
  const salt = b64dec(vault.salt);
  const key = await deriveKey(pw, salt, vault.iter);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64dec(vault.iv), additionalData: AAD }, key, b64dec(vault.ct));
  return { sess: { key, salt, iter: vault.iter }, data: JSON.parse(new TextDecoder().decode(pt)) };
}

// ---------- État ----------
let S = null;        // données déchiffrées (en mémoire uniquement)
let session = null;  // { key (non exportable), salt, iter }
let wiped = false;
const UI = { tab: 'dash', month: today().slice(0, 7), txMonth: '', txCat: '', txSearch: '' };

const DEFAULT_CATS = [
  ['salaire', 'Salaire', 'revenu', '#22b07d'], ['revenus', 'Autres revenus', 'revenu', '#7cc49a'],
  ['logement', 'Logement', 'depense', '#4f7cff'], ['alim', 'Alimentation', 'depense', '#f5a524'],
  ['transport', 'Transport', 'depense', '#12a5b8'], ['energie', 'Énergie & eau', 'depense', '#f76b15'],
  ['abos', 'Abonnements & télécom', 'depense', '#8e4ec6'], ['resto', 'Restaurants & sorties', 'depense', '#d6409f'],
  ['shopping', 'Shopping', 'depense', '#e5484d'], ['sante', 'Santé', 'depense', '#2bb5a0'],
  ['loisirs', 'Loisirs & voyages', 'depense', '#7c8a2e'], ['assurances', 'Assurances', 'depense', '#5b6b7f'],
  ['impots', 'Impôts & taxes', 'depense', '#9a6b3f'], ['divers', 'Divers', 'depense', '#8a8f98'],
  ['virements', 'Épargne & virements internes', 'transfert', '#b0b5bd'], ['none', 'Non classé', 'depense', '#c9ccd1'],
];
const DEFAULT_RULES = [
  ['salaire', 'salaire'], ['caf ', 'revenus'], ['remboursement', 'revenus'], ['loyer', 'logement'],
  ['carrefour', 'alim'], ['leclerc', 'alim'], ['auchan', 'alim'], ['lidl', 'alim'], ['intermarche', 'alim'],
  ['monoprix', 'alim'], ['franprix', 'alim'], ['picard', 'alim'], ['super u', 'alim'], ['boulangerie', 'alim'],
  ['uber eats', 'resto'], ['deliveroo', 'resto'], ['restaurant', 'resto'], ['brasserie', 'resto'], ['mcdo', 'resto'],
  ['sncf', 'transport'], ['ratp', 'transport'], ['navigo', 'transport'], ['uber', 'transport'], ['totalenergies', 'transport'],
  ['station', 'transport'], ['peage', 'transport'], ['edf', 'energie'], ['engie', 'energie'], ['veolia', 'energie'],
  ['free mobile', 'abos'], ['orange', 'abos'], ['sfr', 'abos'], ['bouygues', 'abos'], ['netflix', 'abos'],
  ['spotify', 'abos'], ['disney', 'abos'], ['canal+', 'abos'], ['amazon', 'shopping'], ['fnac', 'shopping'],
  ['decathlon', 'shopping'], ['pharmacie', 'sante'], ['medecin', 'sante'], ['docteur', 'sante'], ['mutuelle', 'sante'],
  ['maif', 'assurances'], ['macif', 'assurances'], ['axa', 'assurances'], ['assurance', 'assurances'],
  ['dgfip', 'impots'], ['impot', 'impots'], ['airbnb', 'loisirs'], ['booking', 'loisirs'], ['cinema', 'loisirs'],
  ['livret', 'virements'], ['epargne', 'virements'], ['virement interne', 'virements'],
];
const ENVELOPES = ['PEA', 'CTO', 'Assurance-vie', 'PER', 'Livret', 'Compte courant', 'Crypto', 'Immobilier', 'Autre'];
const CLASSES = ['Actions', 'Obligations', 'Fonds euros', 'Monétaire / Livrets', 'Immobilier', 'Crypto', 'Liquidités', 'Autre'];
const PALETTE = ['#4f7cff', '#22b07d', '#f5a524', '#e5484d', '#8e4ec6', '#12a5b8', '#d6409f', '#7c8a2e', '#f76b15', '#5b6b7f'];

function defaultState() {
  return {
    version: 1, created: today(),
    categories: DEFAULT_CATS.map(([id, name, kind, color]) => ({ id, name, kind, color })),
    rules: DEFAULT_RULES.map(([kw, cat]) => ({ id: uid(), kw, cat })),
    budgets: {}, transactions: [], holdings: [], snapshots: [],
    settings: { lockMinutes: 10, lastBackup: null, discret: false },
    sim: { initial: 10000, monthly: 500, growth: 0, ret: 5, vol: 10, fees: 0.5, infl: 2, years: 20, goal: 300000, wr: 4, real: true, redCat: 'resto', redPct: 20 },
  };
}
function migrate(d) {
  const base = defaultState();
  if (!d || typeof d !== 'object') throw new Error('Données invalides');
  for (const k of Object.keys(base)) if (d[k] === undefined) d[k] = base[k];
  for (const k of ['categories', 'rules', 'transactions', 'holdings', 'snapshots']) if (!Array.isArray(d[k])) d[k] = base[k];
  d.settings = { ...base.settings, ...d.settings };
  d.sim = { ...base.sim, ...d.sim };
  if (!d.categories.some(c => c.id === 'none')) d.categories.push({ id: 'none', name: 'Non classé', kind: 'depense', color: '#c9ccd1' });
  d.categories.forEach(c => { c.color = safeColor(c.color); if (!['depense', 'revenu', 'transfert'].includes(c.kind)) c.kind = 'depense'; });
  d.transactions = d.transactions.filter(t => t && /^\d{4}-\d{2}-\d{2}$/.test(t.date) && Number.isFinite(t.amount));
  return d;
}

// ---------- Persistance ----------
let rev = 0, savedRev = 0, saveTimer = null, saveChain = Promise.resolve();
function setStatus(t) { const el = $('#status'); if (el) el.textContent = t; }
function save() { rev++; setStatus('Modifications…'); clearTimeout(saveTimer); saveTimer = setTimeout(persistNow, 250); }
function persistNow() {
  clearTimeout(saveTimer);
  const r = rev;
  saveChain = saveChain.then(async () => {
    if (!session || wiped || r < savedRev) return;
    try {
      const v = await encryptObj(S, session);
      if (wiped) return;
      await writeVault(JSON.stringify(v));
      savedRev = Math.max(savedRev, r);
      if (savedRev >= rev) setStatus('🔐 Chiffré et enregistré · ' + storeLabel());
    } catch (e) {
      setStatus('⚠ Échec de l’enregistrement');
      toast('Erreur d’enregistrement : ' + e.message, 'err');
    }
  });

function idb(mode, fn) {
  return new Promise((res, rej) => {
    const r = indexedDB.open('financesPerso', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onerror = () => rej(r.error);
    r.onsuccess = () => {
      const tx = r.result.transaction('kv', mode), q = fn(tx.objectStore('kv'));
      tx.oncomplete = () => { r.result.close(); res(q && q.result); };
      tx.onerror = () => rej(tx.error);
    };
  });
}
const getHandle = () => idb('readonly', s => s.get('handle')).catch(() => null);
const setHandle = h => idb('readwrite', s => s.put(h, 'handle'));
const forgetHandle = () => idb('readwrite', s => s.delete('handle')).catch(() => {});
async function ensurePerm(h) { const o = { mode: 'readwrite' }; return (await h.queryPermission(o)) === 'granted' || (await h.requestPermission(o)) === 'granted'; }

async function writeVault(text) {
  if (store.type === 'file') { const w = await store.handle.createWritable(); await w.write(text); await w.close(); }
  else localStorage.setItem(VAULT_KEY, text);
}

function catById(id) { return S.categories.find(c => c.id === id) || S.categories.find(c => c.id === 'none'); }

// ---------- Statistiques ----------
function monthStats(m) {
  let inc = 0, exp = 0; const byCat = {};
  for (const t of S.transactions) {
    if (!t.date.startsWith(m) || isTransfer(t)) continue;
    if (t.amount >= 0) inc += t.amount; else exp -= t.amount;
    byCat[t.cat] = (byCat[t.cat] || 0) + t.amount;
  }
  return { inc, exp, net: inc - exp, byCat };
}
function spendingByCat(st) {
  return Object.entries(st.byCat).filter(([, v]) => v < 0)
    .map(([id, v]) => { const c = catById(id); return { label: c.name, value: -v, color: c.color }; })
    .sort((a, b) => b.value - a.value);
}
function dataMonths(n) {
  const cur = today().slice(0, 7);
  let ms = [...new Set(S.transactions.map(t => t.date.slice(0, 7)))].sort();
  if (ms.length > 1) ms = ms.filter(m => m !== cur); // mois en cours incomplet
  return ms.slice(-n);
}
function avgMonthly(n) {
  const ms = dataMonths(n);
  if (!ms.length) return { inc: 0, exp: 0, net: 0, n: 0 };
  let inc = 0, exp = 0;
  ms.forEach(m => { const s = monthStats(m); inc += s.inc; exp += s.exp; });
  return { inc: inc / ms.length, exp: exp / ms.length, net: (inc - exp) / ms.length, n: ms.length };
}
function avgCatSpend(cat, n = 6) {
  const ms = dataMonths(n); if (!ms.length) return 0;
  return ms.reduce((s, m) => s + Math.max(0, -(monthStats(m).byCat[cat] || 0)), 0) / ms.length;
}
function allMonths() { const s = new Set(S.transactions.map(t => t.date.slice(0, 7))); s.add(today().slice(0, 7)); return [...s].sort().reverse(); }
const hValue = h => h.qty * h.price, hCost = h => h.qty * h.pru;
const netWorth = () => S.holdings.reduce((s, h) => s + hValue(h), 0);
const totalCost = () => S.holdings.reduce((s, h) => s + hCost(h), 0);
function upsertSnapshot() {
  const d = today(), total = round2(netWorth());
  const s = S.snapshots.find(x => x.date === d);
  if (s) s.total = total; else S.snapshots.push({ date: d, total });
  S.snapshots.sort((a, b) => a.date.localeCompare(b.date));
}

// ---------- Graphiques SVG (sans bibliothèque) ----------
function niceMax(v) { if (v <= 0) return 1; const e = Math.pow(10, Math.floor(Math.log10(v))), f = v / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e; }
const legend = items => `<div class="legend">${items.map(s => `<span><i style="background:${s.color}${s.dash ? ';opacity:.6' : ''}"></i>${esc(s.name)}</span>`).join('')}</div>`;
function barChart(labels, series) {
  const W = 640, H = 240, L = 52, R = 8, T = 12, B = 26, iw = W - L - R, ih = H - T - B;
  const max = niceMax(Math.max(1, ...series.flatMap(s => s.values)));
  let g = '';
  for (let i = 0; i <= 4; i++) { const y = T + ih - ih * i / 4; g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" class="grid"/><text x="${L - 6}" y="${y + 4}" class="axis" text-anchor="end">${compact(max * i / 4)}</text>`; }
  const gw = iw / labels.length, bw = Math.min(16, gw * 0.75 / series.length);
  labels.forEach((lab, i) => {
    const x0 = L + gw * i + (gw - bw * series.length) / 2;
    series.forEach((s, j) => {
      const v = s.values[i] || 0, h = ih * v / max;
      g += `<rect x="${x0 + j * bw}" y="${T + ih - h}" width="${Math.max(1, bw - 2)}" height="${Math.max(0, h)}" rx="2" style="fill:${s.color}"><title>${esc(s.name)} · ${esc(lab)} : ${esc(fmtEur(v))}</title></rect>`;
    });
    g += `<text x="${L + gw * i + gw / 2}" y="${H - 8}" class="axis" text-anchor="middle">${esc(lab)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">${g}</svg>${legend(series)}`;
}
function lineChart({ labels, series, band }) {
  const W = 640, H = 260, L = 56, R = 12, T = 12, B = 26, iw = W - L - R, ih = H - T - B;
  const all = series.flatMap(s => s.values).concat(band ? band.hi : []).filter(Number.isFinite);
  const max = niceMax(Math.max(1, ...all)); let min = Math.min(0, ...all); if (min < 0) min = -niceMax(-min);
  const n = labels.length, x = i => L + (n <= 1 ? iw / 2 : iw * i / (n - 1)), y = v => T + ih - (v - min) / (max - min) * ih;
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = min + (max - min) * i / 4, yy = y(v); g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" class="grid"/><text x="${L - 6}" y="${yy + 4}" class="axis" text-anchor="end">${compact(v)}</text>`; }
  const step = Math.max(1, Math.ceil(n / 7));
  labels.forEach((lab, i) => { if (i % step === 0 || i === n - 1) g += `<text x="${x(i)}" y="${H - 8}" class="axis" text-anchor="middle">${esc(lab)}</text>`; });
  if (band) {
    const pts = band.hi.map((v, i) => `${x(i)},${y(v)}`).concat(band.lo.map((v, i) => `${x(i)},${y(v)}`).reverse());
    g += `<polygon points="${pts.join(' ')}" style="fill:${band.color};opacity:.16"/>`;
  }
  series.forEach(s => {
    g += `<polyline points="${s.values.map((v, i) => `${x(i)},${y(v)}`).join(' ')}" fill="none" style="stroke:${s.color}" stroke-width="2.2" ${s.dash ? 'stroke-dasharray="5 4"' : ''} stroke-linejoin="round"/>`;
    if (n <= 80) s.values.forEach((v, i) => { g += `<circle cx="${x(i)}" cy="${y(v)}" r="7" fill="transparent"><title>${esc(s.name)} · ${esc(labels[i])} : ${esc(fmtEur(v, false))}</title></circle>`; });
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">${g}</svg>${legend(series.concat(band ? [{ name: band.name, color: band.color }] : []))}`;
}
function donut(items) {
  const total = items.reduce((s, i) => s + i.value, 0); if (total <= 0) return empty('Rien à afficher.');
  const r = 60, C = 2 * Math.PI * r; let off = 0, g = '';
  items.forEach(it => {
    const len = C * it.value / total;
    g += `<circle cx="80" cy="80" r="${r}" fill="none" style="stroke:${it.color}" stroke-width="26" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"><title>${esc(it.label)} : ${esc(fmtEur(it.value))}</title></circle>`;
    off += len;
  });
  g += `<text x="80" y="78" text-anchor="middle" style="fill:var(--muted);font-size:11px">Total</text><text x="80" y="96" text-anchor="middle" class="amt" style="fill:var(--text);font-size:15px;font-weight:650">${esc(compact(total))}</text>`;
  return `<div class="donut-wrap"><svg viewBox="0 0 160 160" role="img">${g}</svg><div class="donut-legend">${items.map(it =>
    `<div><span class="dot" style="background:${it.color}"></span>${esc(it.label)}<span class="n">${money(it.value, false)}</span><span class="p">${pct(it.value / total)}</span></div>`).join('')}</div></div>`;
}
const empty = msg => `<p class="empty">${esc(msg)}</p>`;
const kpi = (l, v, s = '') => `<div class="kpi"><div class="l">${esc(l)}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
function monthSelect(sel) { return `<select data-chg="setMonth">${allMonths().map(m => `<option value="${m}"${m === sel ? ' selected' : ''}>${esc(monthLabel(m))}</option>`).join('')}</select>`; }

let CSV = null;
async function readFileText(file) {
  const buf = await file.arrayBuffer();
  let txt = new TextDecoder('utf-8').decode(buf);
  if (txt.includes('�')) txt = new TextDecoder('windows-1252').decode(buf); // exports bancaires souvent en ANSI
  return txt.replace(/^﻿/, '');
}
function parseCSV(text) {
  const first = text.split(/\r?\n/).find(l => l.trim()) || '';
  const delim = [';', ',', '\t', '|'].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.map(r => r.map(c => c.trim())).filter(r => r.some(c => c));
}
function parseDate(s) {
  s = String(s || '').trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return validDate(+m[1], +m[2], +m[3]);
  if ((m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/))) return validDate(m[3].length === 2 ? 2000 + +m[3] : +m[3], +m[2], +m[1]);
  return null;
}
function validDate(y, mo, d) { return mo >= 1 && mo <= 12 && d >= 1 && d <= 31 && y > 1900 && y < 2200 ? `${y}-${pad(mo)}-${pad(d)}` : null; }
function parseAmount(s) {
  s = String(s ?? '').replace(/[\s  €]|EUR/gi, '');
  if (!s) return null;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (/-$/.test(s)) { neg = true; s = s.slice(0, -1); }
  if (s.includes(',') && s.includes('.')) s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else if (s.includes(',')) s = s.replace(',', '.');
  const n = Number(s);
  return Number.isFinite(n) ? (neg ? -Math.abs(n) : n) : null;
}
function startCsvImport(rows) {
  if (rows.length < 1) { toast('Fichier vide ou illisible.', 'err'); return; }
  // ligne d'en-tête = première ligne ayant le nombre de colonnes le plus fréquent (ignore les préambules bancaires)
  const counts = {}; rows.forEach(r => { counts[r.length] = (counts[r.length] || 0) + 1; });
  const ncol = +Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0];
  const start = rows.findIndex(r => r.length === ncol);
  const hasHeader = !rows[start].some(c => parseDate(c));
  const header = hasHeader ? rows[start] : rows[start].map((_, i) => 'Colonne ' + (i + 1));
  const data = rows.slice(hasHeader ? start + 1 : start).filter(r => r.length >= Math.min(ncol, 2));
  const h = header.map(norm), sample = data[0] || [];
  const isDateCol = i => /date/.test(h[i]) || !!parseDate(sample[i]);
  // les colonnes « Date opération » / « Date valeur » ne doivent pas être prises pour un libellé ou un montant
  const find = (re, fb = -1, dateOk = false) => { const i = h.findIndex((x, j) => re.test(x) && (dateOk || !isDateCol(j))); return i >= 0 ? i : fb; };
  const dateI = find(/date/, sample.findIndex(c => parseDate(c)), true);
  const debit = find(/debit/), credit = find(/credit/);
  const amount = find(/montant|amount|somme|valeur/, sample.findIndex((c, i) => !isDateCol(i) && parseAmount(c) !== null && /\d/.test(c)));
  const label = find(/libell|label|descr|wording|intitul|operation|nature|detail/, sample.findIndex((c, i) => !isDateCol(i) && parseAmount(c) === null));
  CSV = { header, data, guess: { date: dateI, label, amount, debit, credit, mode: debit >= 0 || credit >= 0 ? 'split' : 'single' } };
  const opts = sel => `<option value="-1">—</option>` + header.map((c, i) => `<option value="${i}"${i === sel ? ' selected' : ''}>${esc(c || 'Colonne ' + (i + 1))}</option>`).join('');

      </div>
      <label class="inline"><input type="checkbox" name="invert"> Inverser le signe (relevé de carte où les dépenses sont positives)</label>
      <label class="inline"><input type="checkbox" name="dedupe" checked> Ignorer les opérations déjà présentes (même date, montant et libellé)</label>
      <div id="csvPrev"></div>

function csvMap(f) {
  const v = n => +f.elements[n].value;
  return { date: v('date'), label: v('label'), label2: v('label2'), mode: f.elements.mode.value, amount: v('amount'), debit: v('debit'), credit: v('credit'), invert: f.elements.invert.checked };
}
function csvRows(map) {
  const ok = []; let bad = 0;
  for (const r of CSV.data) {
    const date = parseDate(r[map.date]);
    let amount;
    if (map.mode === 'split') {
      const d = map.debit >= 0 ? parseAmount(r[map.debit]) : null, c = map.credit >= 0 ? parseAmount(r[map.credit]) : null;
      amount = (d === null && c === null) ? null : (c || 0) - Math.abs(d || 0);
    } else amount = map.amount >= 0 ? parseAmount(r[map.amount]) : null;
    const label = [r[map.label], map.label2 >= 0 ? r[map.label2] : ''].filter(Boolean).join(' — ').replace(/\s+/g, ' ').trim();
    if (!date || amount === null || !label) { bad++; continue; }
    ok.push({ date, label: label.slice(0, 200), amount: round2(map.invert ? -amount : amount) });
  }
  return { ok, bad };
}
function csvPreview(f) {
  const map = csvMap(f);
  $$('[data-m]', f).forEach(el => { el.hidden = el.dataset.m !== map.mode; });
  const { ok, bad } = csvRows(map);

}

function simulate(p) {
  const years = Math.round(clamp(p.years, 1, 60)), months = years * 12, N = 1000;
  const rm = Math.pow(1 + p.ret / 100, 1 / 12) - 1, feeF = Math.pow(1 - clamp(p.fees, 0, 99) / 100, 1 / 12);
  const sig = Math.max(0, p.vol) / 100, mu = Math.log(Math.max(0.01, 1 + p.ret / 100));
  const mMu = mu / 12 - sig * sig / 24, mSig = sig / Math.sqrt(12);
  const contribAt = m => p.monthly * Math.pow(1 + p.growth / 100, Math.floor((m - 1) / 12));
  const det = [p.initial], contrib = [p.initial];
  let v = p.initial, c = p.initial;
  for (let m = 1; m <= months; m++) { v = v * (1 + rm) * feeF + contribAt(m); c += contribAt(m); if (m % 12 === 0) { det.push(v); contrib.push(c); } }
  // Monte-Carlo (graine fixe => résultats stables d'une saisie à l'autre)
  const rnd = mulberry32(12345), byYear = Array.from({ length: years + 1 }, () => new Float64Array(N));
  let spare = null;
  const gauss = () => { if (spare !== null) { const s = spare; spare = null; return s; } let u = 0; while (!u) u = rnd(); const w = rnd(), r = Math.sqrt(-2 * Math.log(u)); spare = r * Math.sin(2 * Math.PI * w); return r * Math.cos(2 * Math.PI * w); };
  for (let i = 0; i < N; i++) {
    let x = p.initial; byYear[0][i] = x;
    for (let m = 1; m <= months; m++) { x = Math.max(0, x * Math.exp(mMu + mSig * gauss()) * feeF + contribAt(m)); if (m % 12 === 0) byYear[m / 12][i] = x; }
  }
  const P = (arr, q) => arr[Math.min(N - 1, Math.floor(q * N))];
  const p10 = [], p50 = [], p90 = [];
  byYear.forEach(a => { a.sort(); p10.push(P(a, 0.1)); p50.push(P(a, 0.5)); p90.push(P(a, 0.9)); });
  const defl = y => Math.pow(1 + p.infl / 100, y);
  const goalNominal = p.goal * defl(years);
  const success = byYear[years].reduce((s, x) => s + (x >= goalNominal ? 1 : 0), 0) / N;
  const goalYear = p50.findIndex((x, y) => x / defl(y) >= p.goal);
  return { years, det, contrib, p10, p50, p90, defl, success, goalYear };
}
let simTimer = null;
function renderProjResults() {
  const p = S.sim, r = simulate(p), Y = r.years, y0 = new Date().getFullYear();
  const adj = (arr) => p.real ? arr.map((v, y) => v / r.defl(y)) : arr;
  const det = adj(r.det), p10 = adj(r.p10), p50 = adj(r.p50), p90 = adj(r.p90), con = adj(r.contrib);
  const realFinal = r.p50[Y] / r.defl(Y);
  const unit = p.real ? '€ d’aujourd’hui' : '€ courants';
  $('#simOut').innerHTML = `
    <div class="kpis">
      ${kpi(`Capital médian en ${y0 + Y}`, money(p50[Y], false), unit)}
      ${kpi('Fourchette probable (80 %)', `<span style="font-size:16px">${money(p10[Y], false)} – ${money(p90[Y], false)}</span>`, 'scénarios pessimiste / optimiste')}
      ${kpi('Total versé', money(r.contrib[Y], false), 'en € courants')}
      ${kpi('Probabilité d’atteindre l’objectif', pct(r.success), r.goalYear >= 0 ? `atteint vers ${y0 + r.goalYear} (médiane)` : 'non atteint en médiane')}
      ${kpi('Revenu mensuel soutenable', money(realFinal * p.wr / 100 / 12, false), `retrait de ${String(p.wr).replace('.', ',')} %/an, € d’aujourd’hui`)}
    </div>
    <div class="card"><h3>Évolution projetée du capital (${esc(unit)})</h3>
      ${lineChart({ labels: det.map((_, y) => String(y0 + y)), band: { lo: p10, hi: p90, color: 'var(--accent)', name: 'Fourchette 10 %–90 %' },
        series: [{ name: 'Médiane (Monte-Carlo)', color: 'var(--accent)', values: p50 }, { name: 'Rendement constant', color: 'var(--pos)', values: det, dash: true }, { name: 'Versements cumulés', color: 'var(--muted)', values: con }] })}
      <details><summary>Détail année par année</summary><div class="table-wrap"><table class="tbl"><thead><tr><th>Année</th><th class="num">Versé</th><th class="num">Rendement constant</th><th class="num">Pessimiste (10 %)</th><th class="num">Médiane</th><th class="num">Optimiste (90 %)</th></tr></thead><tbody>
        ${det.map((_, y) => `<tr><td>${y0 + y}</td><td class="num">${money(con[y], false)}</td><td class="num">${money(det[y], false)}</td><td class="num">${money(p10[y], false)}</td><td class="num"><b>${money(p50[y], false)}</b></td><td class="num">${money(p90[y], false)}</td></tr>`).join('')}
      </tbody></table></div></details>
      <p class="muted small" style="margin-bottom:0">1 000 trajectoires aléatoires (rendements log-normaux mensuels) pour refléter la volatilité. Les performances passées ne préjugent pas des performances futures.</p>
    </div>`;
  // Simulation d'économies
  const avgSpend = avgCatSpend(p.redCat), saved = avgSpend * clamp(p.redPct, 0, 100) / 100;
  const rm = Math.pow(1 + p.ret / 100, 1 / 12) - 1, feeF = Math.pow(1 - p.fees / 100, 1 / 12);
  let fv = 0; for (let m = 0; m < Y * 12; m++) fv = fv * (1 + rm) * feeF + saved;
  $('#savOut').innerHTML = avgSpend > 0 ? `
    <p style="margin:0 0 6px">Dépense moyenne actuelle : <b>${money(avgSpend, false)}/mois</b> en ${esc(catById(p.redCat).name)}.</p>
    <p style="margin:0 0 6px">Économie : <b class="pos">${money(saved, false)}/mois</b>, soit ${money(saved * 12, false)}/an.</p>
    <p style="margin:0">Investie au rendement de ${String(p.ret).replace('.', ',')} %, elle représenterait <b class="pos">${money(fv / r.defl(Y), false)}</b> (€ d’aujourd’hui) dans ${Y} ans.</p>`
    : empty('Pas encore de dépenses dans cette catégorie sur les 6 derniers mois.');
}

// ---------- Fichiers ----------
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function askBackupPassword(raw, mode) {
  let v; try { v = JSON.parse(raw); } catch { v = null; }
  if (!isVault(v)) { toast('Ce fichier n’est pas une sauvegarde Finances perso valide.', 'err'); return; }
  pendingImport = { raw, vault: v, mode };
  openModal('Restaurer une sauvegarde', `
    <form data-form="restore" class="stack" autocomplete="off">
      <p class="muted" style="margin:0">Saisissez le mot de passe <b>avec lequel cette sauvegarde a été créée</b>.${mode === 'settings' ? ' Les données actuelles seront <b>remplacées</b>.' : ''}</p>

  const total = s.holdings.reduce((a, h) => a + hValue(h), 0);

  catName: el => { const c = catById(el.dataset.id); const v = el.value.trim(); if (v) { c.name = v; save(); } else el.value = c.name; },
  catKind: el => { catById(el.dataset.id).kind = el.value; save(); },
  csvFile: async el => { const f = el.files[0]; el.value = ''; if (!f) return; try { startCsvImport(parseCSV(await readFileText(f))); } catch (e) { toast('Lecture impossible : ' + e.message, 'err'); } },
  csvPreview: el => csvPreview(el),
  restoreFile: async el => { const f = el.files[0], mode = el.dataset.mode; el.value = ''; if (f) askBackupPassword(await f.text(), mode); },
};

const INP = {
  txSearch: el => { UI.txSearch = el.value; renderTxTable(); },
  sim: el => {
    if (el.type === 'checkbox') S.sim[el.name] = el.checked;
    else if (el.tagName === 'SELECT') S.sim[el.name] = el.value;
    else { if (el.value === '' || !Number.isFinite(+el.value)) return; S.sim[el.name] = +el.value; }
    save(); clearTimeout(simTimer); simTimer = setTimeout(renderProjResults, 120);
  },
};

const SUBMIT = {
  async unlock(f) {
    const btn = $('button', f), err = $('#lockErr');
    btn.disabled = true; btn.textContent = 'Déchiffrement…'; err.textContent = '';
    let v;
    try {
      if (store.type === 'file' && !(await ensurePerm(store.handle))) throw new Error('Accès au fichier refusé.');
      v = JSON.parse(await readVaultText());
      if (!isVault(v)) throw new Error('Ce fichier n’est pas un coffre Finances perso.');
    } catch (e) {
      err.textContent = e.name === 'NotFoundError' ? 'Fichier introuvable (déplacé ou supprimé ?). Utilisez « Ouvrir un fichier de données ».' : e.message;
      btn.disabled = false; btn.textContent = 'Déverrouiller';
      return;
    }
    try {
      const { sess, data } = await decryptVault(v, f.elements.pw.value);
      session = sess; S = migrate(data); startApp();
    } catch {
      err.textContent = 'Mot de passe incorrect (ou coffre endommagé).';
      f.elements.pw.value = ''; f.elements.pw.focus();
      btn.disabled = false; btn.textContent = 'Déverrouiller';
    }
  },
  async create(f) {
    const pw = f.elements.pw.value, err = $('#lockErr');
    if (pw.length < 12) { err.textContent = '12 caractères minimum.'; return; }
    if (pw !== f.elements.pw2.value) { err.textContent = 'Les deux mots de passe diffèrent.'; return; }
    if (FS_OK) {
      try { store = { type: 'file', handle: await pickSaveFile() }; }
      catch { err.textContent = 'Création annulée : aucun emplacement choisi.'; return; }
    } else store = { type: 'local' };
    $('button', f).disabled = true;
    session = await newSession(pw); S = defaultState(); rev++;
    await persistNow();
    if (savedRev < rev) { err.textContent = 'Impossible d’écrire le fichier de données.'; $('button', f).disabled = false; return; }
    if (store.type === 'file') await setHandle(store.handle);
    startApp();
  },
  async restore(f) {
    const err = $('#restoreErr'), btn = $('button[type=submit]', f);
    btn.disabled = true; err.textContent = 'Déchiffrement…';
    try {
      const { sess, data } = await decryptVault(pendingImport.vault, f.elements.pw.value);
      const restored = migrate(data);
      if (pendingImport.mode === 'lock') { session = sess; S = restored; }
      else { S = restored; } // reste chiffré avec la clé de la session en cours
      pendingImport = null; closeModal(); rev++; await persistNow();
      if ($('#app').hidden) startApp(); else { UI.month = latestMonth(); refresh(); }
      toast('Sauvegarde restaurée.');
    } catch { err.textContent = 'Mot de passe incorrect ou fichier endommagé.'; btn.disabled = false; }
  },
  async changePw(f) {
    const pw = f.elements.pw.value;
    if (pw !== f.elements.pw2.value) { toast('Les deux nouveaux mots de passe diffèrent.', 'err'); return; }
    try { await persistNow(); await decryptVault(JSON.parse(await readVaultText()), f.elements.cur.value); }
    catch { toast('Mot de passe actuel incorrect.', 'err'); return; }
    session = await newSession(pw); rev++; await persistNow();
    f.reset(); toast('Mot de passe changé. Pensez à refaire une sauvegarde : les anciennes gardent l’ancien mot de passe.');
  },
  txSave(f) {
    const e = f.elements, id = e.id.value, label = e.label.value.trim();
    const amount = round2(Math.abs(num(e.amount.value)) * (e.type.value === 'dep' ? -1 : 1));
    const data = { date: e.date.value, label, amount, cat: e.cat.value || categorize(label), note: e.note.value.trim() };
    if (id) Object.assign(findTx(id), data); else S.transactions.push({ id: uid(), ...data });
    closeModal(); save(); renderTx();
  },
  ruleSave(f) {
    const kw = f.elements.kw.value.trim(), cat = f.elements.cat.value;
    if (!kw) return;
    S.rules.unshift({ id: uid(), kw, cat }); // nouvelle règle prioritaire
    let n = 0;
    if (f.elements.apply.checked) S.transactions.forEach(t => { if (norm(t.label).includes(norm(kw)) && t.cat !== cat) { t.cat = cat; n++; } });
    closeModal(); save(); refresh(); toast(`Règle créée${n ? `, ${n} opération(s) reclassée(s)` : ''}.`);
  },
  csvImport(f) {
    const { ok } = csvRows(csvMap(f));
    const key = t => `${t.date}|${t.amount.toFixed(2)}|${norm(t.label)}`;
    const existing = new Map();
    if (f.elements.dedupe.checked) S.transactions.forEach(t => existing.set(key(t), (existing.get(key(t)) || 0) + 1));
    let added = 0, dup = 0;
    for (const t of ok) {
      const k = key(t), c = existing.get(k) || 0;
      if (c > 0) { existing.set(k, c - 1); dup++; continue; }
      S.transactions.push({ id: uid(), ...t, cat: categorize(t.label) }); added++;
    }
    CSV = null; closeModal(); save(); UI.month = latestMonth(); renderTx();
    const unc = S.transactions.filter(t => t.cat === 'none').length;
    toast(`${added} opération(s) importée(s)${dup ? `, ${dup} doublon(s) ignoré(s)` : ''}${unc ? ` · ${unc} non classée(s)` : ''}.`);
  },
  invSave(f) {
    const e = f.elements, id = e.id.value;
    const data = { name: e.name.value.trim(), ticker: e.ticker.value.trim(), envelope: e.envelope.value, cls: e.cls.value, qty: Math.max(0, num(e.qty.value)), pru: Math.max(0, num(e.pru.value)), price: Math.max(0, num(e.price.value)), updated: today() };
    if (id) Object.assign(findH(id), data); else S.holdings.push({ id: uid(), realized: 0, ops: [], ...data });
    upsertSnapshot(); closeModal(); save(); renderInv();
  },
  invTrade(f) {
    const e = f.elements, h = findH(e.id.value); if (!h) return;
    const q = Math.max(0, num(e.qty.value)), p = Math.max(0, num(e.price.value)), fees = Math.max(0, num(e.fees.value));
    if (!q) return;
    if (e.side.value === 'buy') {
      const nq = h.qty + q; h.pru = (h.qty * h.pru + q * p + fees) / nq; h.qty = nq;
    } else {
      if (q > h.qty + 1e-9) { toast('Quantité vendue supérieure à la quantité détenue.', 'err'); return; }
      const g = q * (p - h.pru) - fees; h.realized = (h.realized || 0) + g; h.qty = Math.max(0, h.qty - q);
      toast(`Plus-value réalisée : ${fmtEur(g)}`);
    }
    if (e.setPrice.checked) { h.price = p; h.updated = today(); }
    (h.ops = h.ops || []).push({ date: e.date.value, side: e.side.value, qty: q, price: p, fees });
    upsertSnapshot(); closeModal(); save(); renderInv();
  },
  catAdd(f) {
    const name = f.elements.name.value.trim(); if (!name) return;
    S.categories.splice(S.categories.length - 1, 0, { id: uid(), name, kind: f.elements.kind.value, color: PALETTE[S.categories.length % PALETTE.length] });
    save(); renderSettings();
  },
};

document.addEventListener('click', e => {
  if (e.target.id === 'modal') { closeModal(); return; }
  const el = e.target.closest('[data-act]');
  if (el && ACT[el.dataset.act]) ACT[el.dataset.act](el, e);
});
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el, e); });
document.addEventListener('input', e => { const el = e.target.closest('[data-inp]'); if (el && INP[el.dataset.inp]) INP[el.dataset.inp](el, e); });
document.addEventListener('submit', e => { e.preventDefault(); const f = e.target; if (SUBMIT[f.dataset.form]) SUBMIT[f.dataset.form](f, e); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });

showLock();
</script>
</body>
